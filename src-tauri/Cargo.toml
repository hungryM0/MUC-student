[package]
name = "muc-student"
version = "0.1.0"
description = "适用于 MUC 的校园网多账号桌面应用"
authors = ["MUC-student contributors"]
edition = "2021"

[lib]
name = "muc_student_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4.0.1"
keyring-core = "1.0.0"
ocrs = "0.12.2"
regex = "1"
reqwest = { version = "0.13.4", features = ["charset", "cookies", "json", "rustls", "form"], default-features = false }
rten = "0.24.0"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
