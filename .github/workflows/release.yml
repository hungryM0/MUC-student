name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Pull repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Format workspace
        run: cargo fmt --check

      - name: Test workspace
        run: cargo test

      - name: Build WinUI app
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath target\release\MUC-student.exe -Destination dist\MUC-student.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUC-student-Windows
          path: dist/MUC-student.exe

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/MUC-student.exe --draft --title "${{ github.ref_name }}" --notes "自动构建的 Windows 可执行文件，详见附件。"
