name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Pull repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Format workspace
        run: cargo fmt --check

      - name: Test workspace
        run: cargo test

      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem -Path target,src-tauri\target -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bundle\\nsis\\' } |
            Select-Object -First 1
          if (-not $installer) {
            throw "未找到 Tauri NSIS 安装包"
          }
          Copy-Item -LiteralPath $installer.FullName -Destination ("dist\MUC-student_{0}_setup.exe" -f "${{ github.ref_name }}")

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MUC-student_${{ github.ref_name }}_setup.exe
          path: dist/MUC-student_${{ github.ref_name }}_setup.exe

  release-android:
    runs-on: ubuntu-latest

    steps:
      - name: Pull repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 28.2.13676358
          link-to-sdk: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Format workspace
        run: cargo fmt --check

      - name: Test workspace
        run: cargo test

      - name: Build Android app
        run: pnpm tauri:android:build

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "未找到 Android APK"
            exit 1
          fi
          cp "$apk" "dist/MUC-student_${{ github.ref_name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: MUC-student_${{ github.ref_name }}.apk
          path: dist/MUC-student_${{ github.ref_name }}.apk

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - release-windows
      - release-android
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: MUC-student_${{ github.ref_name }}_setup.exe
          path: dist

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: MUC-student_${{ github.ref_name }}.apk
          path: dist

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/MUC-student_${{ github.ref_name }}_setup.exe
            dist/MUC-student_${{ github.ref_name }}.apk
