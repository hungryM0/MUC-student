name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - name: Pull repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Compile
        run: uv run python -m compileall main.py app application domain infrastructure ui scripts

      - name: Pytest
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: uv run python -m pytest -q
