<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="fluent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#008395" />
      <stop offset="100%" stop-color="#004d61" />
    </linearGradient>
    
    <!-- 白色波纹发光阴影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fluent 风格的圆角矩形背景 -->
  <rect width="512" height="512" rx="120" fill="url(#fluent-grad)"/>

  <!-- 网络电波与字母 M 融合的抽象设计 -->
  <g filter="url(#glow)">
    <!-- 信号外弧 (WiFi 3) -->
    <path d="M 96 210 A 220 220 0 0 1 416 210" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- 信号中弧 (WiFi 2) -->
    <path d="M 160 274 A 130 130 0 0 1 352 274" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- 信号小弧 (WiFi 1) / M 的顶峰 -->
    <path d="M 216 330 A 56 56 0 0 1 296 330" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- 中心连接圆点 -->
    <circle cx="256" cy="386" r="26" fill="#ffffff" />
  </g>
</svg>
